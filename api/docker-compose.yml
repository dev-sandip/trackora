
services:
  postgres:
    image: postgis/postgis:16-3.5
    container_name: trackora-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trackora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trackora"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"

volumes:
  postgres_data:
